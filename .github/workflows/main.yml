name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Create dummy .env files
      - name: Create dummy .env files
        run: touch .env.example .env

      # 2. Generate standard debug.keystore
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 3. Create dummy google-services.json with correct package name
      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.toywonder.kpznvw"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_api_key" }],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # 4. Regenerate Gradle Wrapper
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --no-daemon

      # 5. Grant execute permission
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
