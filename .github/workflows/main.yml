name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install Gradle directly on runner
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Files
        run: |
          touch .env.example .env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" >> .env

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Decode google-services.json from GitHub Secrets
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SECRET" ]; then
            echo "::error ::GOOGLE_SERVICES_JSON secret is empty or missing in GitHub Secrets!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json

      # Generate Gradle wrapper on-the-fly if missing
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      # Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
